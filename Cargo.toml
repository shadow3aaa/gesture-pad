[workspace]
members = ["crates/gesture-model", "apps/live", "apps/annotator"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
burn = { version = "=0.22.1", default-features = false, features = ["std", "cuda", "optim", "autotune"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2 # Training in debug builds would otherwise be unusably slow.

[profile.release]
lto = "thin"
codegen-units = 1
